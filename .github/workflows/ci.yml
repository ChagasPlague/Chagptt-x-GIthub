name: CI
on:
  push:
    branches: [main, master, feat/universo-if-avalia-mvp, feat/universo-if-avalia-v2, feat/universo-if-avalia-v2.1]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Compilar interface para ambiente privado
        run: npm run build
      - name: Compilar catálogo público sem backend
        run: npm run build
        env:
          VITE_CATALOG_ONLY: 'true'
          VITE_APPS_SCRIPT_URL: ''
